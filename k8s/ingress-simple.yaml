# Ingress for control.gmac.io via Traefik
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control-panel-ingress
  namespace: control-panel
  annotations:
    # Use Traefik as ingress controller
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: control.gmac.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: control-panel-service
            port:
              number: 80
  # Also allow access via IP without host header
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: control-panel-service
            port:
              number: 80
