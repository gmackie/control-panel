# Simplified deployment for initial K3s setup
# Use: kubectl apply -f deploy-simple.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: control-panel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-panel-config
  namespace: control-panel
data:
  NODE_ENV: "production"
  NEXTAUTH_URL: "https://control.gmac.io"
  GITEA_URL: "https://git.gmac.io"
  DRONE_SERVER: ""
  HARBOR_URL: "https://registry.gmac.io"
  ARGOCD_SERVER: ""
  PROMETHEUS_URL: ""
  K8S_API_SERVER: "https://5.78.106.236:6443"
  DATABASE_HOST: ""
  DATABASE_PORT: "5432"
  DATABASE_NAME: "control_panel"
  REDIS_HOST: ""
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-panel-integrations
  namespace: control-panel
data:
  GRAFANA_URL: ""
  GRAFANA_EXTERNAL_URL: ""
  HARBOR_PROJECT: "library"
  GITEA_ORG: "gmac"
---
# NOTE: Secret removed from this file to prevent overwriting existing secrets.
# Use ./update-cluster-secrets.sh or 03-secret.yaml for initial secret creation.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-panel
  namespace: control-panel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-panel
  namespace: control-panel
  labels:
    app.kubernetes.io/name: control-panel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-panel
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: control-panel
      imagePullSecrets:
      - name: harbor-registry
      containers:
      - name: control-panel
        image: registry.gmac.io/gmac/control-panel:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: control-panel-config
              key: NODE_ENV
        - name: NEXTAUTH_URL
          valueFrom:
            configMapKeyRef:
              name: control-panel-config
              key: NEXTAUTH_URL
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: NEXTAUTH_SECRET
        - name: GITHUB_ID
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: GITHUB_CLIENT_ID
        - name: GITHUB_SECRET
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: GITHUB_CLIENT_SECRET
        - name: AZURE_AD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: AZURE_AD_CLIENT_ID
              optional: true
        - name: AZURE_AD_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: AZURE_AD_CLIENT_SECRET
              optional: true
        - name: AZURE_AD_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: AZURE_AD_TENANT_ID
              optional: true
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: DATABASE_URL
        - name: FORGEGRAPH_API_URL
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: FORGEGRAPH_API_URL
              optional: true
        - name: FORGEGRAPH_CONTROL_PLANE_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: FORGEGRAPH_CONTROL_PLANE_WEBHOOK_TOKEN
              optional: true
        - name: FORGEGRAPH_CONTROL_PLANE_WEBHOOK_PATH
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: FORGEGRAPH_CONTROL_PLANE_WEBHOOK_PATH
              optional: true
        - name: FORGEGRAPH_CONTROL_PLANE_WEBHOOK_TIMEOUT_MS
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: FORGEGRAPH_CONTROL_PLANE_WEBHOOK_TIMEOUT_MS
              optional: true
        - name: PROMETHEUS_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: PROMETHEUS_BEARER_TOKEN
              optional: true
        - name: FORGEGRAPH_AUTO_ROLLBACK_ENABLED
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: FORGEGRAPH_AUTO_ROLLBACK_ENABLED
              optional: true
        - name: FORGEGRAPH_AUTO_ROLLBACK_SEVERITIES
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: FORGEGRAPH_AUTO_ROLLBACK_SEVERITIES
              optional: true
        - name: FORGEGRAPH_AUTO_ROLLBACK_ENVIRONMENTS
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: FORGEGRAPH_AUTO_ROLLBACK_ENVIRONMENTS
              optional: true
        - name: FORGEGRAPH_ROLLBACK_DEDUPE_WINDOW_MS
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: FORGEGRAPH_ROLLBACK_DEDUPE_WINDOW_MS
              optional: true
        - name: GITEA_URL
          valueFrom:
            configMapKeyRef:
              name: control-panel-config
              key: GITEA_URL
        - name: GITEA_TOKEN
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: GITEA_TOKEN
              optional: true
        - name: ARGOCD_SERVER
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: ARGOCD_SERVER
              optional: true
        - name: ARGOCD_TOKEN
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: ARGOCD_TOKEN
              optional: true
        - name: PROMETHEUS_URL
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: PROMETHEUS_URL
              optional: true
        - name: K3S_SA_TOKEN
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: K3S_SA_TOKEN
              optional: true
        - name: K8S_API_URL
          value: "https://5.78.106.236:6443"
        - name: NEON_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: control-panel-secrets
              key: NEON_DATABASE_URL
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: control-panel-service
  namespace: control-panel
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30080
  selector:
    app.kubernetes.io/name: control-panel
