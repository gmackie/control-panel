fullnameOverride: loki

# Single-node Loki (no object storage). Uses a Longhorn PVC for filesystem storage.
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 720h

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    size: 50Gi

# Disable memcached caches (they request ~10Gi each and will not schedule on this cluster).
chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Ensure SimpleScalable targets are disabled.
write:
  replicas: 0

read:
  replicas: 0

backend:
  replicas: 0

gateway:
  enabled: true
