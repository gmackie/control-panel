name: Build and Deploy Control Panel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: registry.gmac.io
  IMAGE_NAME: control-panel
  PNPM_VERSION: 9.15.1

jobs:
  # Typecheck and lint
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ env.PNPM_VERSION }}
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Typecheck
      run: pnpm typecheck
    
    - name: Lint
      run: pnpm lint
      continue-on-error: true

  # Build and push Docker image
  build:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Harbor Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/gmac/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NEXT_PUBLIC_API_URL=https://control.gmac.io/api

  # Deploy to K3s cluster
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
    
    - name: Deploy to K3s
      run: |
        # Update the image (use short SHA to match docker metadata)
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        kubectl set image deployment/control-panel \
          control-panel=${{ env.REGISTRY }}/gmac/${{ env.IMAGE_NAME }}:${SHORT_SHA} \
          -n control-panel
        
        # Wait for rollout
        kubectl rollout status deployment/control-panel -n control-panel --timeout=300s
    
    - name: Verify deployment
      run: |
        # Check pod status
        kubectl get pods -n control-panel -l app=control-panel
        
        # Run health check
        kubectl exec -n control-panel deployment/control-panel -- wget -q -O - http://localhost:3000/api/health || echo "Health check skipped"
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "Deployment failed! Rolling back..."
        kubectl rollout undo deployment/control-panel -n control-panel
        kubectl rollout status deployment/control-panel -n control-panel --timeout=120s
