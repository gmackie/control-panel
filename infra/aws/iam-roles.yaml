AWSTemplateFormatVersion: '2010-09-09'
Description: IAM Roles for GMAC Control Panel - Read-only monitoring and GitHub Actions CDK deployment

Parameters:
  GitHubOrg:
    Type: String
    Default: gmackie
    Description: GitHub organization or username

  GitHubRepo:
    Type: String
    Default: control-panel
    Description: GitHub repository name

  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name

Resources:
  # GitHub OIDC Provider (only create if not exists)
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Purpose
          Value: GitHub Actions OIDC
        - Key: ManagedBy
          Value: CloudFormation

  # Read-Only Role for Control Panel monitoring
  ControlPanelReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'gmac-control-panel-readonly-${Environment}'
      Description: Read-only role for GMAC Control Panel to monitor AWS resources
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Allow GitHub Actions to assume this role
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'
          # Allow EC2 instances (for self-hosted runners or K8s pods)
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: CostExplorerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CostExplorerReadOnly
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetDimensionValues
                  - ce:GetTags
                  - ce:GetReservationUtilization
                  - ce:GetSavingsPlansUtilization
                  - ce:GetAnomalies
                Resource: '*'
              - Sid: BillingReadOnly
                Effect: Allow
                Action:
                  - aws-portal:ViewBilling
                  - aws-portal:ViewUsage
                  - budgets:ViewBudget
                  - budgets:DescribeBudgets
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Control Panel Read-Only Access
        - Key: ManagedBy
          Value: CloudFormation

  # CDK Deployment Role for GitHub Actions
  CDKDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'gmac-cdk-deployment-${Environment}'
      Description: Role for CDK deployments via GitHub Actions
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main'
      ManagedPolicyArns:
        # CloudFormation full access for CDK deployments
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
      Policies:
        - PolicyName: CDKDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CDK Bootstrap access
              - Sid: CDKBootstrap
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/cdk-bootstrap/*'
              # S3 access for CDK assets
              - Sid: CDKAssetsBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:aws:s3:::cdk-*-assets-${AWS::AccountId}-*'
                  - !Sub 'arn:aws:s3:::cdk-*-assets-${AWS::AccountId}-*/*'
              # ECR access for container images
              - Sid: ECRAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - ecr:DeleteRepository
                  - ecr:SetRepositoryPolicy
                  - ecr:GetRepositoryPolicy
                Resource: '*'
              # IAM PassRole for service roles
              - Sid: PassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/cdk-*'
              # Lambda deployment
              - Sid: LambdaDeployment
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListFunctions
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:InvokeFunction
                  - lambda:PublishVersion
                  - lambda:CreateAlias
                  - lambda:UpdateAlias
                  - lambda:DeleteAlias
                  - lambda:ListAliases
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource: '*'
              # API Gateway
              - Sid: APIGateway
                Effect: Allow
                Action:
                  - apigateway:*
                Resource: '*'
              # DynamoDB
              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:ListTables
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:CreateBackup
                  - dynamodb:DescribeBackup
                  - dynamodb:DeleteBackup
                  - dynamodb:ListBackups
                Resource: '*'
              # SQS
              - Sid: SQS
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:ListQueues
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource: '*'
              # SNS
              - Sid: SNS
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:ListTopics
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:TagResource
                  - sns:UntagResource
                Resource: '*'
              # CloudWatch Logs
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource: '*'
              # Secrets Manager
              - Sid: SecretsManager
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource: '*'
              # SSM Parameter Store
              - Sid: SSMParameterStore
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:AddTagsToResource
                  - ssm:RemoveTagsFromResource
                Resource: '*'
              # S3 for application buckets
              - Sid: S3Buckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketAcl
                  - s3:PutBucketAcl
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetBucketEncryption
                  - s3:PutBucketEncryption
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketCORS
                  - s3:PutBucketCORS
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                Resource: '*'
              # IAM for creating service roles
              - Sid: IAMServiceRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/gmac-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/cdk-*'
              # CloudWatch Events / EventBridge
              - Sid: EventBridge
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                  - events:TagResource
                  - events:UntagResource
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: CDK Deployment via GitHub Actions
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  ReadOnlyRoleArn:
    Description: ARN of the read-only role for Control Panel
    Value: !GetAtt ControlPanelReadOnlyRole.Arn
    Export:
      Name: !Sub 'gmac-control-panel-readonly-role-arn-${Environment}'

  CDKDeploymentRoleArn:
    Description: ARN of the CDK deployment role for GitHub Actions
    Value: !GetAtt CDKDeploymentRole.Arn
    Export:
      Name: !Sub 'gmac-cdk-deployment-role-arn-${Environment}'

  GitHubOIDCProviderArn:
    Description: ARN of the GitHub OIDC Provider
    Value: !GetAtt GitHubOIDCProvider.Arn
    Export:
      Name: github-oidc-provider-arn
